[package]
name = "territories"
version = "0.8.25"
description = "Organized Territories"
edition = "2021"
rust-version = "1.82"

[lib]
name = "territories_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
swift-rs = { version = "1.0.7", features = ["build"] }
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-nearby = { path = "plugins/nearby" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }
snow = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
flate2 = "1"
base64 = "0.22"
if-addrs = "0.15"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(not(any(target_os = "ios", target_os = "macos")))'.dependencies]
mdns-sd = "0.21.4"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
libc = "0.2.189"

# The Rust core only stores, merges and encrypts small records, so size
# counts for more than speed in the shipped app.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false

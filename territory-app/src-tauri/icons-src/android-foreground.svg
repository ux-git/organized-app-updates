<svg width="1512" height="1512" viewBox="-8 -8 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Organized app icon, expanded: the petals continue past every edge and blend where they meet (soft mesh + inner edge light, highlights at 65%).
    Petal geometry is the current logo's (public/favicon.svg). Each petal keeps
    its own colour family; its inner edge - the side facing the centre and its
    neighbour - carries a continuous soft light line.
  -->
  <defs>
    <clipPath id="tile"><rect width="32" height="32" rx="9" /></clipPath>

    <filter id="mesh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1" />
    </filter>
    <!-- wide soft halo and a tighter bright core for the edge light -->
    <filter id="edgeHalo" filterUnits="userSpaceOnUse" x="-4" y="-4" width="40" height="40">
      <feGaussianBlur stdDeviation="0.75" />
    </filter>
    <filter id="edgeCore" filterUnits="userSpaceOnUse" x="-4" y="-4" width="40" height="40">
      <feGaussianBlur stdDeviation="0.3" />
    </filter>

    <!-- violet: lavender top, violet body, magenta-pink tip -->
    <linearGradient id="violetBase" x1="5" y1="0" x2="5" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9A6CF5" />
      <stop offset="0.55" stop-color="#A24DEA" />
      <stop offset="1" stop-color="#CF45DD" />
    </linearGradient>
    <radialGradient id="violetLight" cx="3" cy="3.5" r="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C8A6FF" />
      <stop offset="1" stop-color="#C8A6FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violetPink" cx="9" cy="18" r="6.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F277DA" />
      <stop offset="1" stop-color="#F277DA" stop-opacity="0" />
    </radialGradient>

    <!-- yellow to orange -->
    <linearGradient id="yellowBase" x1="11" y1="5" x2="32" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD93B" />
      <stop offset="0.5" stop-color="#FFB320" />
      <stop offset="1" stop-color="#FF8A1F" />
    </linearGradient>
    <radialGradient id="yellowLight" cx="14.5" cy="4.5" r="7.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE85E" />
      <stop offset="1" stop-color="#FFE85E" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="yellowWarm" cx="31" cy="13" r="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6F2E" stop-opacity="0.8" />
      <stop offset="1" stop-color="#FF6F2E" stop-opacity="0" />
    </radialGradient>

    <!-- lime to deep green -->
    <linearGradient id="greenBase" x1="26" y1="11" x2="27" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8BE25A" />
      <stop offset="0.5" stop-color="#3DC75A" />
      <stop offset="1" stop-color="#1E9E52" />
    </linearGradient>
    <radialGradient id="greenLight" cx="24" cy="13.5" r="6.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C2F47E" />
      <stop offset="1" stop-color="#C2F47E" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="greenDeep" cx="30" cy="30" r="7" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#128A47" stop-opacity="0.85" />
      <stop offset="1" stop-color="#128A47" stop-opacity="0" />
    </radialGradient>

    <!-- aqua to azure -->
    <linearGradient id="blueBase" x1="0" y1="28" x2="21" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EE2E4" />
      <stop offset="0.5" stop-color="#3DB0F2" />
      <stop offset="1" stop-color="#2F80F2" />
    </linearGradient>
    <radialGradient id="blueLight" cx="5" cy="29.5" r="7" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8CF4EC" />
      <stop offset="1" stop-color="#8CF4EC" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueDeep" cx="19" cy="25.5" r="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D6BF3" stop-opacity="0.75" />
      <stop offset="1" stop-color="#3D6BF3" stop-opacity="0" />
    </radialGradient>

    <path id="petalYellow" d="M26.8146 10.7649L16.186 10.7649C13.2134 10.7649 10.8036 8.35506 10.8036 5.38244C10.8036 2.40982 13.2134 3.06368e-05 16.186 3.09348e-05L23.7066 3.15309e-05V-0.874023C25.2102 -0.874023 26.4938 -0.546315 27.5702 3.18885e-05L32 3.22461e-05V6.99763C32.0094 7.15182 32.014 7.30403 32.014 7.45374V16.2658C32.014 13.327 29.7132 10.9257 26.8146 10.7649Z" />
    <path id="petalViolet" d="M10.2155 -0.660889H-0.666626V8.50078H-0.00553715L-0.00553745 15.7902C-0.00553757 18.7814 2.41932 21.2063 5.41054 21.2063C8.40175 21.2063 10.8266 18.7814 10.8266 15.7902L10.8266 5.44968C10.8406 2.41878 13.3019 -0.0339113 16.3361 -0.0339114L10.2155 -0.0339111V-0.660889Z" />
    <path id="petalBlue" d="M5.1952 21.1657L15.792 21.1657C18.7838 21.1657 21.2092 23.5911 21.2092 26.5829C21.2092 29.5747 18.7838 32.0001 15.792 32.0001L3.86224e-05 32.0001L3.99943e-05 24.038C-0.00365316 23.9435 -0.00549293 23.8498 -0.00549292 23.7572L-0.00549316 15.6661C-0.00475739 18.6047 2.2965 21.0056 5.1952 21.1657Z" />
    <path id="petalGreen" d="M24.7449 32.0001L32 32.0001V27.1788C32.4207 26.2026 32.6668 25.0691 32.6668 23.7701H32V16.1556C32 13.166 29.5765 10.7424 26.5868 10.7424C23.5972 10.7424 21.1736 13.166 21.1736 16.1556L21.1736 23.7701H21.1736V26.4971C21.1736 29.5399 18.7069 32.0066 15.664 32.0066H24.4372C24.5387 32.0066 24.6413 32.0045 24.7449 32.0001Z" />

    <!-- inner-edge light lines, inset just inside each petal's outline -->
    <path id="edgeViolet" d="M10.25 5.38 V15.79 A4.84 4.84 0 0 1 5.41 20.63 H2.6" />
    <path id="edgeYellow" d="M11.38 3.6 V5.38 A4.81 4.81 0 0 0 16.19 10.19 H26.59" />
    <path id="edgeGreen" d="M29.7 12.44 A4.84 4.84 0 0 0 21.75 16.16 V26.58" />
    <path id="edgeBlue" d="M5.41 21.74 H15.79 A4.84 4.84 0 0 1 20.34 28.23" />

    <!-- the lines fade in and out at their ends instead of stopping bluntly -->
    <linearGradient id="fadeViolet" x1="10.25" y1="5.38" x2="2.6" y2="20.63" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C8A6FF" stop-opacity="0" />
      <stop offset="0.15" stop-color="#C8A6FF" />
      <stop offset="0.85" stop-color="#F277DA" />
      <stop offset="1" stop-color="#F277DA" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="fadeYellow" x1="11.38" y1="3.6" x2="26.59" y2="10.19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE85E" stop-opacity="0" />
      <stop offset="0.15" stop-color="#FFE85E" />
      <stop offset="0.85" stop-color="#FFD04A" />
      <stop offset="1" stop-color="#FFD04A" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="fadeGreen" x1="29.7" y1="12.44" x2="21.75" y2="26.58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C2F47E" stop-opacity="0" />
      <stop offset="0.15" stop-color="#C2F47E" />
      <stop offset="0.85" stop-color="#9EE86E" />
      <stop offset="1" stop-color="#9EE86E" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="fadeBlue" x1="5.41" y1="21.74" x2="20.34" y2="28.23" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8CF4EC" stop-opacity="0" />
      <stop offset="0.15" stop-color="#8CF4EC" />
      <stop offset="0.85" stop-color="#8FB8FF" />
      <stop offset="1" stop-color="#8FB8FF" stop-opacity="0" />
    </linearGradient>

    <clipPath id="clipYellow"><use href="#petalYellow" /></clipPath>
    <clipPath id="clipViolet"><use href="#petalViolet" /></clipPath>
    <clipPath id="clipBlue"><use href="#petalBlue" /></clipPath>
    <clipPath id="clipGreen"><use href="#petalGreen" /></clipPath>
  <filter id="blend" filterUnits="userSpaceOnUse" x="-20" y="-20" width="72" height="72"><feGaussianBlur stdDeviation="1.9"/></filter><clipPath id="extViolet"><rect x="-12" y="-12" width="18" height="27.7"/><rect x="-12" y="-12" width="28.2" height="18"/></clipPath><clipPath id="extYellow"><rect x="16.2" y="-12" width="27.8" height="18"/><rect x="26" y="-12" width="18" height="28.2"/></clipPath><clipPath id="extGreen"><rect x="26" y="16.2" width="18" height="27.8"/><rect x="15.8" y="26" width="28.2" height="18"/></clipPath><clipPath id="extBlue"><rect x="-12" y="26" width="27.8" height="18"/><rect x="-12" y="15.7" width="18" height="28.3"/></clipPath><filter id="featherBlur" filterUnits="userSpaceOnUse" x="-20" y="-20" width="72" height="72"><feGaussianBlur stdDeviation="1.1"/></filter><mask id="feather" maskUnits="userSpaceOnUse" x="-20" y="-20" width="72" height="72"><rect x="1.2" y="1.2" width="29.6" height="29.6" rx="3" fill="#FFFFFF" filter="url(#featherBlur)"/></mask></defs>

  <g>
    <g filter="url(#blend)"><g clip-path="url(#extViolet)"><rect x="-12" y="-12" width="56" height="56" fill="url(#violetBase)"/><g filter="url(#mesh)" opacity="0.65"><rect x="-12" y="-12" width="56" height="56" fill="url(#violetLight)"/><rect x="-12" y="-12" width="56" height="56" fill="url(#violetPink)"/></g></g><g clip-path="url(#extYellow)"><rect x="-12" y="-12" width="56" height="56" fill="url(#yellowBase)"/><g filter="url(#mesh)" opacity="0.65"><rect x="-12" y="-12" width="56" height="56" fill="url(#yellowLight)"/><rect x="-12" y="-12" width="56" height="56" fill="url(#yellowWarm)"/></g></g><g clip-path="url(#extGreen)"><rect x="-12" y="-12" width="56" height="56" fill="url(#greenBase)"/><g filter="url(#mesh)" opacity="0.65"><rect x="-12" y="-12" width="56" height="56" fill="url(#greenLight)"/><rect x="-12" y="-12" width="56" height="56" fill="url(#greenDeep)"/></g></g><g clip-path="url(#extBlue)"><rect x="-12" y="-12" width="56" height="56" fill="url(#blueBase)"/><g filter="url(#mesh)" opacity="0.65"><rect x="-12" y="-12" width="56" height="56" fill="url(#blueLight)"/><rect x="-12" y="-12" width="56" height="56" fill="url(#blueDeep)"/></g></g></g><rect x="4.48" y="4.46" width="23.03" height="23.07" fill="#FFFFFF" />

    <g mask="url(#feather)"><g clip-path="url(#clipViolet)">
      <rect x="-12" y="-12" width="56" height="56" fill="url(#violetBase)" />
      <g filter="url(#mesh)" opacity="0.65">
        <rect x="-12" y="-12" width="56" height="56" fill="url(#violetLight)" />
        <rect x="-12" y="-12" width="56" height="56" fill="url(#violetPink)" />
      </g>
      <use href="#edgeViolet" stroke="url(#fadeViolet)" stroke-width="2.6" stroke-linecap="round" opacity="0.49" filter="url(#edgeHalo)" />
      <use href="#edgeViolet" stroke="url(#fadeViolet)" stroke-width="0.9" stroke-linecap="round" opacity="0.585" filter="url(#edgeCore)" />
    </g>

    <g clip-path="url(#clipYellow)">
      <rect x="-12" y="-12" width="56" height="56" fill="url(#yellowBase)" />
      <g filter="url(#mesh)" opacity="0.65">
        <rect x="-12" y="-12" width="56" height="56" fill="url(#yellowLight)" />
        <rect x="-12" y="-12" width="56" height="56" fill="url(#yellowWarm)" />
      </g>
      <use href="#edgeYellow" stroke="url(#fadeYellow)" stroke-width="2.6" stroke-linecap="round" opacity="0.49" filter="url(#edgeHalo)" />
      <use href="#edgeYellow" stroke="url(#fadeYellow)" stroke-width="0.9" stroke-linecap="round" opacity="0.585" filter="url(#edgeCore)" />
    </g>

    <g clip-path="url(#clipGreen)">
      <rect x="-12" y="-12" width="56" height="56" fill="url(#greenBase)" />
      <g filter="url(#mesh)" opacity="0.65">
        <rect x="-12" y="-12" width="56" height="56" fill="url(#greenLight)" />
        <rect x="-12" y="-12" width="56" height="56" fill="url(#greenDeep)" />
      </g>
      <use href="#edgeGreen" stroke="url(#fadeGreen)" stroke-width="2.6" stroke-linecap="round" opacity="0.49" filter="url(#edgeHalo)" />
      <use href="#edgeGreen" stroke="url(#fadeGreen)" stroke-width="0.9" stroke-linecap="round" opacity="0.585" filter="url(#edgeCore)" />
    </g>

    <g clip-path="url(#clipBlue)">
      <rect x="-12" y="-12" width="56" height="56" fill="url(#blueBase)" />
      <g filter="url(#mesh)" opacity="0.65">
        <rect x="-12" y="-12" width="56" height="56" fill="url(#blueLight)" />
        <rect x="-12" y="-12" width="56" height="56" fill="url(#blueDeep)" />
      </g>
      <use href="#edgeBlue" stroke="url(#fadeBlue)" stroke-width="2.6" stroke-linecap="round" opacity="0.49" filter="url(#edgeHalo)" />
      <use href="#edgeBlue" stroke="url(#fadeBlue)" stroke-width="0.9" stroke-linecap="round" opacity="0.585" filter="url(#edgeCore)" />
    </g></g>
  </g>
<defs><linearGradient id="territoryPin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6A7EE6"/><stop offset="1" stop-color="#3E52BE"/></linearGradient></defs><path d="M16 20.0943 C14.9038 18.2905 13.1 16.6143 13.1 14.1 A2.9 2.9 0 1 1 18.9 14.1 C18.9 16.6143 17.0962 18.2905 16 20.0943 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.45" stroke-linejoin="round"/><path d="M16 20.0943 C14.9038 18.2905 13.1 16.6143 13.1 14.1 A2.9 2.9 0 1 1 18.9 14.1 C18.9 16.6143 17.0962 18.2905 16 20.0943 Z" fill="url(#territoryPin)"/><circle cx="16" cy="14.1" r="1.044" fill="#FFFFFF"/></svg>
